<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DM Follow-Up Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f9;color:#181818}
.tab-bar{display:flex;background:#0176D3;padding:0 24px;gap:4px;align-items:flex-end}
.tab-title{color:white;font-size:18px;font-weight:700;padding:14px 0 14px 4px;flex:1}
.refreshed{color:rgba(255,255,255,.65);font-size:12px;padding:14px 8px;align-self:center}
.tab{padding:12px 22px;color:rgba(255,255,255,.7);cursor:pointer;border-radius:6px 6px 0 0;font-size:14px;font-weight:600;border:none;background:none;transition:all .15s}
.tab:hover{color:white;background:rgba(255,255,255,.1)}
.tab.active{color:#0176D3;background:white}
.kpi-bar{display:flex;background:white;border-bottom:2px solid #e8e8e8;flex-wrap:wrap}
.kpi{text-align:center;padding:16px 20px;min-width:110px;border-right:1px solid #f0f0f0}
.kpi .value{font-size:26px;font-weight:700}
.kpi .label{font-size:11px;color:#706E6B;margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.green{color:#2E844A}.red{color:#C23934}.blue{color:#0176D3}
.controls{display:flex;gap:12px;padding:14px 24px;background:white;border-bottom:1px solid #e8e8e8;flex-wrap:wrap;align-items:center}
.controls label{font-size:12px;color:#706E6B;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
select,input{padding:7px 11px;border:1px solid #DDDBDA;border-radius:4px;font-size:13px;background:white;cursor:pointer}
select{min-width:200px}input{min-width:200px}
.count-badge{font-size:12px;color:#706E6B;margin-left:auto;background:#f4f6f9;padding:5px 12px;border-radius:12px}
.table-wrap{padding:20px 24px}
table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
th{background:#f8f8f8;padding:10px 14px;text-align:left;font-size:11px;color:#706E6B;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #e8e8e8;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{background:#efefef}th.asc::after{content:" ↑"}th.desc::after{content:" ↓"}
td{padding:9px 14px;font-size:13px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:last-child td{border-bottom:none}tr:hover td{background:#fafcff}
.bar-wrap{display:flex;align-items:center;gap:8px;min-width:180px}
.bar-bg{flex:1;background:#f0f0f0;border-radius:3px;height:10px;position:relative}
.bar-fill{height:10px;border-radius:3px}
.bar-target{position:absolute;top:-3px;bottom:-3px;width:2px;background:#0176D3;border-radius:1px;opacity:.7}
.bar-val{font-size:12px;color:#706E6B;white-space:nowrap;min-width:50px;text-align:right}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600}
.g{background:#e6f3eb;color:#2E844A}.y{background:#fef3e2;color:#DD7A01}.r{background:#fde8e8;color:#C23934}
.tat-wrap{display:flex;gap:3px;align-items:flex-end;height:28px}
.tat-bar{width:18px;border-radius:2px 2px 0 0;position:relative;cursor:default}
.tat-bar:hover::after{content:attr(data-tip);position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:#333;color:white;font-size:10px;white-space:nowrap;padding:2px 6px;border-radius:3px;pointer-events:none}
.tat-label{font-size:9px;color:#706E6B;text-align:center;margin-top:2px}
.tat-col{min-width:140px}
.no-results{text-align:center;padding:48px;color:#706E6B;font-size:14px}
.page{display:none}.page.active{display:block}
.ms-wrap{position:relative;display:inline-block}
.ms-btn{padding:7px 11px;border:1px solid #DDDBDA;border-radius:4px;font-size:13px;background:white;cursor:pointer;min-width:200px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ms-list{display:none;position:absolute;top:calc(100% + 2px);left:0;z-index:200;background:white;border:1px solid #DDDBDA;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.12);min-width:100%;max-height:260px;overflow-y:auto}
.ms-list.open{display:block}
.ms-item{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 10px;cursor:pointer;font-size:13px;user-select:none;white-space:nowrap}
.ms-item:hover{background:#f4f6f9}
.ms-item input[type=checkbox]{cursor:pointer;accent-color:#0176D3;flex-shrink:0}
.view-toggle{display:flex;gap:3px;background:#f0f0f0;border-radius:6px;padding:3px}
.vt-btn{padding:5px 14px;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;color:#706E6B;background:none;transition:all .15s}
.vt-btn.active{background:white;color:#0176D3;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.mgr-view{padding:20px 24px}
.mgr-card{background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.mgr-hdr-row,.mgr-data-row{display:flex;align-items:center;gap:12px;padding:9px 14px}
.mgr-hdr-row{background:#f8f8f8;border-bottom:1px solid #e8e8e8;font-size:11px;color:#706E6B;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.mgr-data-row{border-bottom:1px solid #f0f0f0}
.mgr-data-row:last-child{border-bottom:none}
.mgr-data-row:nth-child(odd){background:#fafcff}
.mgr-chip{width:38px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;flex-shrink:0}
.mgr-name{min-width:190px;font-size:13px;font-weight:600;color:#181818}
.mgr-bar-wrap{flex:1;display:flex;align-items:center;gap:8px;min-width:180px}
.mgr-stat{font-size:12px;color:#706E6B;min-width:70px;text-align:center}
.stk-bar{display:flex;height:14px;border-radius:4px;overflow:hidden;flex:1;min-width:160px}
.stk-seg{display:flex;align-items:center;justify-content:center;font-size:9px;color:white;font-weight:700;overflow:hidden;white-space:nowrap;min-width:0}
</style>
</head>

function outreachUrl(ownerId){

function aggregateReps(rawRows){
  const map={};
  rawRows.forEach(r=>{
    const k=r.REP_ID||r.REP_NAME;
    if(!map[k]) map[k]={REP_ID:r.REP_ID,REP_NAME:r.REP_NAME,MANAGER_NAME:r.MANAGER_NAME,
      DIRECTOR_NAME:r.DIRECTOR_NAME,AREA_DIRECTOR_NAME:r.AREA_DIRECTOR_NAME,
      SEGMENT:r.SEGMENT,OUTREACH_OWNER_ID:r.OUTREACH_OWNER_ID,
      DELIVERED:0,S1_DONE:0,S2_DONE:0,BOTH_DONE:0,MISSING_FOLLOWUP:0,
      EMAILED:0,CALLED:0,NOT_SEQ_EMAIL_OPT_OUT:0,
      TAT_0D:0,TAT_1D:0,TAT_2D:0,TAT_3D:0,TAT_4_7D:0,TAT_8PLUS_D:0};
    const a=map[k];
    a.DELIVERED+=r.DELIVERED; a.S1_DONE+=r.S1_DONE||0; a.S2_DONE+=r.S2_DONE||0;
    a.BOTH_DONE+=r.BOTH_DONE; a.MISSING_FOLLOWUP+=r.MISSING_FOLLOWUP;
    a.EMAILED+=r.EMAILED||0; a.CALLED+=r.CALLED||0;
    a.NOT_SEQ_EMAIL_OPT_OUT+=r.NOT_SEQ_EMAIL_OPT_OUT||0;
    a.TAT_0D+=r.TAT_0D||0; a.TAT_1D+=r.TAT_1D||0; a.TAT_2D+=r.TAT_2D||0;
    a.TAT_3D+=r.TAT_3D||0; a.TAT_4_7D+=r.TAT_4_7D||0; a.TAT_8PLUS_D+=r.TAT_8PLUS_D||0;
  });
  Object.values(map).forEach(r=>{
    r.PCT_WORKED=r.DELIVERED>0?r.BOTH_DONE/r.DELIVERED*100:0;
    r.STATUS=r.PCT_WORKED>=80?'On Track':r.PCT_WORKED>=50?'At Risk':'Behind';
  });
  return Object.values(map);
}
function updateKpi(m,rows){
  const tD=rows.reduce((s,r)=>s+r.DELIVERED,0);
  const tE=rows.reduce((s,r)=>s+r.EMAILED,0);
  const tC=rows.reduce((s,r)=>s+r.CALLED,0);
  const tM=rows.reduce((s,r)=>s+r.MISSING_FOLLOWUP,0);
  const tB=rows.reduce((s,r)=>s+r.BOTH_DONE,0);
  const tO=rows.reduce((s,r)=>s+r.NOT_SEQ_EMAIL_OPT_OUT,0);
  const pw=tD>0?(tB/tD*100).toFixed(1):'0.0';
  const ot=rows.filter(r=>r.PCT_WORKED>=80).length;
  document.getElementById(`kpi-del-${m}`).textContent=tD.toLocaleString();
  document.getElementById(`kpi-em-${m}`).textContent=tE.toLocaleString();
  document.getElementById(`kpi-ca-${m}`).textContent=tC.toLocaleString();
  document.getElementById(`kpi-mi-${m}`).textContent=tM.toLocaleString();
  const pwEl=document.getElementById(`kpi-pw-${m}`);
  pwEl.textContent=pw+'%'; pwEl.className='value '+(parseFloat(pw)>=80?'green':parseFloat(pw)>=50?'':'red');
  const otEl=document.getElementById(`kpi-ot-${m}`);
  otEl.textContent=`${ot}/${rows.length}`; otEl.className='value '+(rows.length&&ot/rows.length>=0.5?'green':'red');
  document.getElementById(`kpi-op-${m}`).textContent=tO.toLocaleString();
}

    <span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:#DD7A01;display:inline-block"></span>S1 only</span>
    <span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:#2E844A;display:inline-block"></span>Both</span>
    <span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:#BDBDBD;display:inline-block"></span>Neither</span>
  </span>`;
  const hdr = `<div class="mgr-hdr-row"><div style="width:38px"></div><div class="mgr-name">Manager</div><div style="flex:1;display:flex;align-items:center">Step Completion${legend}</div><div class="mgr-stat">Reps</div><div class="mgr-stat">Missing</div></div>`;
  const rowsHtml = mgrs.map((mg,i) => {
    const bothPct = mg.total > 0 ? mg.both / mg.total * 100 : 0;
    const col = bothPct>=80?'#2E844A':bothPct>=50?'#DD7A01':'#C23934';
    const chipBg = (i<3 && mg.both>0) ? MEDALS[i] : col;
    const rank = ['1st','2nd','3rd'][i] || (i+1)+'th';
    const segs = [
      {count:mg.s1only, color:'#DD7A01', tip:'S1 only'},
      {count:mg.both,   color:'#2E844A', tip:'Both done'},
      {count:mg.neither,color:'#BDBDBD', tip:'Neither'},
    ];
    const segHtml = segs.map(s => {
      if (!s.count) return '';
      const w = s.count / mg.total * 100;
      const lbl = w >= 14 ? s.count : '';
      return `<div class="stk-seg" style="width:${w}%;background:${s.color}" title="${s.tip}: ${s.count} rep${s.count!==1?'s':''}">${lbl}</div>`;
    }).join('');
    return `<div class="mgr-data-row">
      <div class="mgr-chip" style="background:${chipBg}">${rank}</div>
      <div class="mgr-name">${mg.name}</div>
      <div class="mgr-bar-wrap"><div class="stk-bar">${segHtml}</div></div>
      <div class="mgr-stat">${mg.both}/${mg.total}</div>
      <div class="mgr-stat" style="color:#C23934">${mg.missing.toLocaleString()}</div>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="mgr-card">${hdr}${rowsHtml}</div>`;
}
function render(m){
  if ((viewState[m]||'rep') === 'mgr') { renderMgr(m); return; }
  const d = MONTHS[m];
  const selMgr = getSelMgr(m);
  const selCp  = getSelCp(m);
  const dir = document.getElementById(`dir-${m}`).value;
  const sg = document.getElementById(`sg-${m}`).value;
  const st = document.getElementById(`st-${m}`).value;
  const sr = document.getElementById(`sr-${m}`).value.toLowerCase();
  document.getElementById(`mg-lbl-${m}`).textContent = selMgr.length ? selMgr.length+' selected' : 'All managers';
  document.getElementById(`cp-lbl-${m}`).textContent = selCp.length  ? selCp.length+' selected'  : 'All campaigns';
  let rawRows = d.reps.filter(r=>
    (!dir||((r.DIRECTOR_NAME||'')===dir||(r.AREA_DIRECTOR_NAME||'')===dir))&&
    (!selMgr.length||selMgr.includes(r.MANAGER_NAME))&&(!sg||r.SEGMENT===sg)&&
    (!selCp.length||(r.CAMPAIGN_NAME?selCp.includes(r.CAMPAIGN_NAME):true))&&
    (!sr||r.REP_NAME.toLowerCase().includes(sr))
  );
  let rows = aggregateReps(rawRows);
  if(st) rows=rows.filter(r=>r.STATUS===st);
  updateKpi(m,rows);
  const sc = sortState[m]||{col:'PCT_WORKED',dir:-1};
  rows.sort((a,b)=>{
    let av=a[sc.col],bv=b[sc.col];
    if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase();}
    return av<bv?-sc.dir:av>bv?sc.dir:0;
  });
  document.getElementById(`cnt-${m}`).textContent =
    rows.length===d.totalReps?`${d.totalReps} reps`:`${rows.length} of ${d.totalReps} reps`;
  const maxN = Math.max(...rows.map(r=>r.PCT_WORKED), 80);
  const tgtPos = Math.min(80/maxN*100, 100);
  const tbody=document.getElementById(`tb-${m}`);
  const nr=document.getElementById(`nr-${m}`);
  const tbl=document.getElementById(`tbl-${m}`);
  if(!rows.length){tbody.innerHTML='';nr.style.display='';tbl.style.display='none';return;}
  nr.style.display='none';tbl.style.display='';
  tbody.innerHTML=rows.map(r=>{
    const pct=parseFloat(r.PCT_WORKED);
    const fw=Math.min(pct/maxN*100,100);
    const tatBuckets=[
      {v:r.TAT_0D||0,label:'Same day',color:'#2E844A'},
      {v:r.TAT_1D||0,label:'1 day',color:'#4CAF7D'},
      {v:r.TAT_2D||0,label:'2 days',color:'#9DC3A8'},
      {v:r.TAT_3D||0,label:'3 days',color:'#DD7A01'},
      {v:r.TAT_4_7D||0,label:'4–7 days',color:'#E89928'},
      {v:r.TAT_8PLUS_D||0,label:'8+ days',color:'#C23934'},
    ];
    const maxTat=Math.max(...tatBuckets.map(b=>b.v),1);
    const tatBars=tatBuckets.map(b=>{
      const h=Math.round(b.v/maxTat*24)+2;
      return b.v>0
        ? `<div style="display:flex;flex-direction:column;align-items:center">
             <div class="tat-bar" style="height:${h}px;background:${b.color}" data-tip="${b.label}: ${b.v}"></div>
             <div class="tat-label">${b.v}</div>
           </div>`
        : `<div style="display:flex;flex-direction:column;align-items:center">
             <div style="width:18px;height:2px"></div>
             <div class="tat-label" style="color:#ddd">0</div>
           </div>`;
    }).join('');
    const tatLabels=['0d','1d','2d','3d','4-7d','8+d'].map(l=>`<div style="width:18px;text-align:center;font-size:9px;color:#aaa">${l}</div>`).join('');
    const repUrl=outreachUrl(r.OUTREACH_OWNER_ID);
    const repLink=repUrl?`<a href="${repUrl}" target="_blank" style="color:#0176D3;text-decoration:none">${r.REP_NAME}</a>`:r.REP_NAME;
    return `<tr>
      <td><strong>${repLink}</strong></td>
      <td>${r.MANAGER_NAME||''}</td>
      <td>${shortSeg(r.SEGMENT||'')}</td>
      <td>${r.DELIVERED}</td>
      <td>${r.EMAILED||0}</td>
      <td>${r.CALLED||0}</td>
      <td><strong>${r.MISSING_FOLLOWUP}</strong></td>
      <td><div class="bar-wrap">
        <div class="bar-bg">
          <div class="bar-fill" style="width:${fw}%;background:${barColor(pct)}"></div>
          <div class="bar-target" style="left:${tgtPos}%"></div>
        </div>
        <span class="bar-val">${pct.toFixed(1)}%</span>
      </div></td>
      <td>${badge(r.STATUS)}</td>
      <td><div class="tat-wrap">${tatBars}</div>
          <div style="display:flex;gap:3px;margin-top:1px">${tatLabels}</div></td>
    </tr>`;
  }).join('');
}

function switchTab(m){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',MONTH_KEYS[i]===m));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(`page-${m}`).classList.add('active');
  render(m);
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.ms-wrap'))document.querySelectorAll('.ms-list').forEach(l=>l.classList.remove('open'));
  const th=e.target.closest('th[data-col]');
  if(!th)return;
  const col=th.dataset.col,m=th.dataset.m,sc=sortState[m];
  if(sc&&sc.col===col)sc.dir*=-1;
  else sortState[m]={col,dir:(col==='REP_NAME'||col==='MANAGER_NAME')?1:-1};
  th.closest('thead').querySelectorAll('th').forEach(t=>t.classList.remove('asc','desc'));
  th.classList.add(sortState[m].dir===1?'asc':'desc');
  render(m);
});

MONTH_KEYS.forEach(m=>{sortState[m]={col:'PCT_WORKED',dir:-1};document.getElementById(`page-${m}`).innerHTML=buildPage(m);});
MONTH_KEYS.forEach(m=>render(m));
</script>
</body>
