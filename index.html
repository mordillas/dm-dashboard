<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DM Nomination Progress Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f9;color:#181818;display:flex;flex-direction:column;height:100vh}
.tab-bar{display:flex;background:#0176D3;padding:0 24px;gap:4px;align-items:flex-end;flex:none}
.tab-title{color:white;font-size:18px;font-weight:700;padding:14px 0 14px 4px;flex:1}
.refreshed{color:rgba(255,255,255,.65);font-size:12px;padding:14px 8px;align-self:center}
.tab{padding:12px 22px;color:rgba(255,255,255,.7);cursor:pointer;border-radius:6px 6px 0 0;font-size:14px;font-weight:600;border:none;background:none;transition:all .15s}
.tab:hover{color:white;background:rgba(255,255,255,.1)}
.tab.active{color:#0176D3;background:white}
.kpi-bar{display:flex;background:white;border-bottom:2px solid #e8e8e8;flex-wrap:wrap;flex:none}
.kpi{text-align:center;padding:16px 20px;min-width:110px;border-right:1px solid #f0f0f0}
.kpi .value{font-size:26px;font-weight:700}
.kpi .label{font-size:11px;color:#706E6B;margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.green{color:#2E844A}.red{color:#C23934}.blue{color:#0176D3}
.kpi-deadline{margin-left:auto;padding:16px 24px;display:flex;align-items:center;gap:6px;font-size:13px;color:#706E6B}
.controls{display:flex;gap:12px;padding:14px 24px;background:white;border-bottom:1px solid #e8e8e8;flex-wrap:wrap;align-items:center;flex:none}
.controls label{font-size:12px;color:#706E6B;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
select,input{padding:7px 11px;border:1px solid #DDDBDA;border-radius:4px;font-size:13px;background:white;cursor:pointer}
select{min-width:200px}input{min-width:200px}
.count-badge{font-size:12px;color:#706E6B;margin-left:auto;background:#f4f6f9;padding:5px 12px;border-radius:12px}
.band{height:20px;background:#f4f6f9;flex:none}
.table-wrap{padding:0 24px 20px;flex:1;overflow-y:auto;min-height:0}
table{width:100%;border-collapse:separate;border-spacing:0;background:white;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
th{background:#f8f8f8;padding:10px 14px;text-align:left;font-size:11px;color:#706E6B;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #e8e8e8;cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;z-index:10}
th:hover{background:#efefef}th.asc::after{content:" ↑"}th.desc::after{content:" ↓"}
td{padding:9px 14px;font-size:13px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:last-child td{border-bottom:none}tr:hover td{background:#fafcff}
.bar-wrap{display:flex;align-items:center;gap:8px;min-width:200px;max-width:220px}
.bar-bg{flex:1;background:#f0f0f0;border-radius:3px;height:10px;position:relative}
.bar-fill{height:10px;border-radius:3px}
.bar-target{position:absolute;top:-3px;bottom:-3px;width:2px;background:#0176D3;border-radius:1px;opacity:.7}
.bar-val{font-size:12px;color:#706E6B;white-space:nowrap;min-width:58px;text-align:right}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600}
.g{background:#e6f3eb;color:#2E844A}.y{background:#fef3e2;color:#DD7A01}.r{background:#fde8e8;color:#C23934}.p{background:#fce4ec;color:#C2185B}
.no-results{text-align:center;padding:48px;color:#706E6B;font-size:14px}
.page{display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden}.page.active{display:flex}
.ms-wrap{position:relative;display:inline-block}
.ms-btn{padding:7px 11px;border:1px solid #DDDBDA;border-radius:4px;font-size:13px;background:white;cursor:pointer;min-width:200px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ms-list{display:none;position:absolute;top:calc(100% + 2px);left:0;z-index:200;background:white;border:1px solid #DDDBDA;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.12);min-width:100%;max-height:260px;overflow-y:auto}
.ms-list.open{display:block}
.ms-item{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 10px;cursor:pointer;font-size:13px;user-select:none;white-space:nowrap}
.ms-item:hover{background:#f4f6f9}
.ms-item input[type=checkbox]{cursor:pointer;accent-color:#0176D3;flex-shrink:0}
.view-toggle{display:flex;gap:3px;background:#f0f0f0;border-radius:6px;padding:3px}
.vt-btn{padding:5px 14px;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;color:#706E6B;background:none;transition:all .15s}
.vt-btn.active{background:white;color:#0176D3;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.mgr-view{padding:0 24px 20px;flex:1;overflow-y:auto;min-height:0}
.mgr-card{background:white;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.mgr-hdr-row,.mgr-data-row{display:flex;align-items:center;gap:12px;padding:9px 14px}
.mgr-hdr-row{background:#f8f8f8;border-bottom:1px solid #e8e8e8;font-size:11px;color:#706E6B;font-weight:600;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;z-index:10}
.mgr-data-row{border-bottom:1px solid #f0f0f0}
.mgr-data-row:last-child{border-bottom:none}
.mgr-data-row:nth-child(odd){background:#fafcff}
.mgr-chip{width:38px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;flex-shrink:0}
.mgr-name{min-width:190px;font-size:13px;font-weight:600;color:#181818}
.mgr-bar-wrap{flex:1;max-width:320px;display:flex;align-items:center;gap:8px;min-width:180px}
.mgr-bar-bg{flex:1;background:#f0f0f0;border-radius:3px;height:10px;position:relative}
.mgr-bar-fill{height:10px;border-radius:3px}
.mgr-bar-tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:#0176D3;border-radius:1px;opacity:.7}
.mgr-pct{font-size:13px;font-weight:700;min-width:44px;text-align:right}
.mgr-stat{font-size:12px;color:#706E6B;min-width:70px;text-align:center}
</style>
</head>

  return `
    <div class="kpi-bar">
      <div class="kpi"><div class="value ${dc}">${d.repsDone}/${d.totalReps}</div><div class="label">At Target</div></div>
      <div class="kpi"><div class="value red">${d.repsBehind}</div><div class="label">Behind</div></div>
      <div class="kpi"><div class="value ${pc}">${d.pct}%</div><div class="label">Rep Progress</div></div>
      <div class="kpi"><div class="value">${d.totalNoms.toLocaleString()}</div><div class="label">Total Noms</div></div>
      <div class="kpi"><div class="value">${d.mm.toLocaleString()}</div><div class="label">MM A+</div></div>
      <div class="kpi"><div class="value">${d.other.toLocaleString()}</div><div class="label">Other</div></div>
      <div class="kpi-deadline">Deadline: <strong>${d.deadline}</strong>&nbsp;&nbsp;${dLabel}</div>
    </div>
    <div class="controls">
      <label>Director</label>
      <select id="dir-${m}" onchange="render('${m}')">
        <option value="">All</option>${dirOpts}
      </select>
      <label>Manager</label>
      <div class="ms-wrap">
        <button class="ms-btn" id="mg-btn-${m}" onclick="toggleMs('mg-list-${m}',event)"><span id="mg-lbl-${m}">All managers</span> ▾</button>
        <div class="ms-list" id="mg-list-${m}">${mgChecks}</div>
      </div>
      <label>Segment</label>
      <select id="sg-${m}" onchange="render('${m}')">
        <option value="">All</option>${sgOpts}
      </select>
      <label>Status</label>
      <select id="st-${m}" onchange="render('${m}')">
        <option value="">All</option>
        <option value="Overachiever">🔴 Overachiever</option>
        <option value="On Track">✅ On Track</option>
        <option value="At Risk">⚠️ At Risk</option>
        <option value="Behind">🔴 Behind</option>
      </select>
      <input id="sr-${m}" type="text" placeholder="Search rep…" oninput="render('${m}')">
      <span class="count-badge" id="cnt-${m}"></span>
      <div class="view-toggle">
        <button class="vt-btn active" id="vt-rep-${m}" onclick="setView('${m}','rep')">By Rep</button>
        <button class="vt-btn" id="vt-mgr-${m}" onclick="setView('${m}','mgr')">By Manager</button>
        <button class="vt-btn" id="vt-ae-${m}" onclick="setView('${m}','ae')">By AE</button>
      </div>
    </div>
    <div class="band"></div>
    <div class="table-wrap" id="tbl-wrap-${m}">
      <table id="tbl-${m}">
        <thead><tr>
          <th data-col="REP_NAME" data-m="${m}">Rep</th>
          <th data-col="MANAGER_NAME" data-m="${m}">Manager</th>
          <th data-col="SEGMENT" data-m="${m}">Segment</th>
          <th data-col="TARGET" data-m="${m}">Noms Goal</th>
          <th data-col="NOMINATIONS_COUNT" data-m="${m}" class="desc">Qualified / Total Noms</th>
          <th data-col="REMAINING" data-m="${m}">Noms Needed</th>
          <th data-col="STATUS" data-m="${m}">Status</th>
          <th data-col="ACCOUNTS_OVER_3" data-m="${m}">Accounts &gt;3 Noms</th>
        </tr></thead>
        <tbody id="tb-${m}"></tbody>
      </table>
      <div class="no-results" id="nr-${m}" style="display:none">No reps match your filters.</div>
    </div>
    <div class="mgr-view" id="mgr-view-${m}" style="display:none"></div>
    <div class="mgr-view" id="ae-view-${m}" style="display:none"></div>`;
}

function getSelMgr(m){
  return [...document.querySelectorAll(`#mg-list-${m} .mg-cb:checked`)].map(c=>c.value);
}
function toggleMs(id,e){
  e.stopPropagation();
  const el=document.getElementById(id);
  const wasOpen=el.classList.contains('open');
  document.querySelectorAll('.ms-list').forEach(l=>l.classList.remove('open'));
  if(!wasOpen)el.classList.add('open');
}
let viewState = {};
function setView(m, view) {
  viewState[m] = view;
  document.getElementById(`tbl-wrap-${m}`).style.display = view==='rep' ? '' : 'none';
  document.getElementById(`mgr-view-${m}`).style.display = view==='mgr' ? '' : 'none';
  document.getElementById(`ae-view-${m}`).style.display = view==='ae' ? '' : 'none';
  document.getElementById(`vt-rep-${m}`).classList.toggle('active', view==='rep');
  document.getElementById(`vt-mgr-${m}`).classList.toggle('active', view==='mgr');
  document.getElementById(`vt-ae-${m}`).classList.toggle('active', view==='ae');
  render(m);
}
function renderAE(m) {
  const d = MONTHS[m];
  const el = document.getElementById(`ae-view-${m}`);
  const aes = (d.ae||[]).slice().sort((a,b) => b.count - a.count);
  if (!aes.length) { el.innerHTML='<div class="no-results">No AE-attributed nominations for this month.</div>'; return; }
  const maxCount = Math.max(...aes.map(a=>a.count), 1);
  const hdr = `<div class="mgr-hdr-row"><div class="mgr-name">Account Executive</div><div style="flex:1;max-width:320px">Nominations</div><div class="mgr-stat">Count</div></div>`;
  const rowsHtml = aes.map((a) => {
    return `<div class="mgr-data-row">
      <div class="mgr-name">${a.name}</div>
      <div class="mgr-bar-wrap"><div class="mgr-bar-bg">
        <div class="mgr-bar-fill" style="width:${Math.min(a.count/maxCount*100,100)}%;background:#0176D3"></div>
      </div></div>
      <div class="mgr-stat">${a.count.toLocaleString()}</div>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="mgr-card">${hdr}${rowsHtml}</div>`;
}
function renderMgr(m) {
  const d = MONTHS[m];
  const selMgr = getSelMgr(m);
  const dir = document.getElementById(`dir-${m}`).value;
  const sg = document.getElementById(`sg-${m}`).value;
  const st = document.getElementById(`st-${m}`).value;
  const sr = document.getElementById(`sr-${m}`).value.toLowerCase();
  let rows = d.reps.filter(r =>
    (!dir||((r.DIRECTOR_NAME||'')===dir||(r.AREA_DIRECTOR_NAME||'')===dir))&&(!selMgr.length||selMgr.includes(r.MANAGER_NAME))&&(!sg||r.SEGMENT===sg)&&(!st||r.STATUS===st)&&(!sr||r.REP_NAME.toLowerCase().includes(sr))
  );
  const mgrMap = {};
  rows.forEach(r => {
    if (!mgrMap[r.MANAGER_NAME]) mgrMap[r.MANAGER_NAME] = {name:r.MANAGER_NAME,pcts:[],noms:0,qualified:0,accountsOver3:0,onTrack:0,total:0};
    const mg = mgrMap[r.MANAGER_NAME];
    mg.pcts.push(parseFloat(r.PCT_COMPLETE));
    mg.noms += r.NOMINATIONS_COUNT;
    mg.qualified += r.QUALIFIED_COUNT||0;
    mg.accountsOver3 += r.ACCOUNTS_OVER_3||0;
    mg.total++;
    if (r.STATUS==='On Track'||r.STATUS==='Overachiever') mg.onTrack++;
  });
  const mgrs = Object.values(mgrMap)
    .map(mg => ({...mg, avgPct: mg.pcts.reduce((s,v)=>s+v,0)/mg.pcts.length}))
    .sort((a,b) => b.avgPct - a.avgPct);
  const maxPct = Math.max(...mgrs.map(mg=>mg.avgPct), 100);
  const maxNoms = Math.max(...mgrs.map(mg=>mg.noms), 1);
  const MEDALS = ['#D4AF37','#9E9E9E','#8B6914'];
  const el = document.getElementById(`mgr-view-${m}`);
  if (!mgrs.length) { el.innerHTML='<div class="no-results">No managers match filters.</div>'; return; }
  const hdr = `<div class="mgr-hdr-row"><div style="width:38px"></div><div class="mgr-name">Manager</div><div style="flex:1;max-width:320px">Avg Progress</div><div class="mgr-pct">Avg %</div><div class="mgr-stat">Reps Done</div><div style="flex:1;max-width:260px">Noms (Qualified)</div><div class="mgr-stat">Accts &gt;3</div></div>`;
  const rowsHtml = mgrs.map((mg,i) => {
    const col = mg.avgPct>=100?'#2E844A':mg.avgPct>=80?'#DD7A01':'#C23934';
    const chipBg = i<3 ? MEDALS[i] : col;
    const rank = ['1st','2nd','3rd'][i] || (i+1)+'th';
    const tgtPos = Math.min(100/maxPct*100, 100);
    const nw = Math.min(mg.noms/maxNoms*100, 100);
    const qw = mg.noms>0 ? Math.min(mg.qualified/mg.noms*nw, nw) : 0;
    return `<div class="mgr-data-row">
      <div class="mgr-chip" style="background:${chipBg}">${rank}</div>
      <div class="mgr-name">${mg.name}</div>
      <div class="mgr-bar-wrap"><div class="mgr-bar-bg">
        <div class="mgr-bar-fill" style="width:${Math.min(mg.avgPct/maxPct*100,100)}%;background:${col}"></div>
        <div class="mgr-bar-tgt" style="left:${tgtPos}%"></div>
      </div></div>
      <div class="mgr-pct" style="color:${col}">${mg.avgPct.toFixed(1)}%</div>
      <div class="mgr-stat">${mg.onTrack}/${mg.total}</div>
      <div class="mgr-bar-wrap" style="flex:1;max-width:260px"><div class="mgr-bar-bg">
        <div class="mgr-bar-fill" style="width:${nw}%;background:#BDBDBD"></div>
        <div class="mgr-bar-fill" style="width:${qw}%;background:#6B4FBB;position:absolute;top:0;left:0"></div>
      </div>
      <span class="bar-val">${mg.noms.toLocaleString()} <span style="color:#6B4FBB">(${mg.qualified.toLocaleString()})</span></span></div>
      <div class="mgr-stat">${mg.accountsOver3>0?`<span class="badge r">⚠️ ${mg.accountsOver3}</span>`:mg.accountsOver3}</div>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="mgr-card">${hdr}${rowsHtml}</div>`;
}
function render(m){
  if ((viewState[m]||'rep') === 'mgr') { renderMgr(m); return; }
  if ((viewState[m]||'rep') === 'ae') { renderAE(m); return; }
  const d = MONTHS[m];
  const selMgr = getSelMgr(m);
  const dir = document.getElementById(`dir-${m}`).value;
  const sg = document.getElementById(`sg-${m}`).value;
  const st = document.getElementById(`st-${m}`).value;
  const sr = document.getElementById(`sr-${m}`).value.toLowerCase();
  document.getElementById(`mg-lbl-${m}`).textContent = selMgr.length ? selMgr.length+' selected' : 'All managers';
  let rows = d.reps.filter(r=>
    (!dir||((r.DIRECTOR_NAME||'')===dir||(r.AREA_DIRECTOR_NAME||'')===dir))&&(!selMgr.length||selMgr.includes(r.MANAGER_NAME))&&(!sg||r.SEGMENT===sg)&&(!st||r.STATUS===st)&&(!sr||r.REP_NAME.toLowerCase().includes(sr))
  );
  const sc = sortState[m]||{col:'NOMINATIONS_COUNT',dir:-1};
  rows.sort((a,b)=>{
    let av=a[sc.col],bv=b[sc.col];
    if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase();}
    return av<bv?-sc.dir:av>bv?sc.dir:0;
  });
  document.getElementById(`cnt-${m}`).textContent =
    rows.length===d.reps.length?`${d.reps.length} reps`:`${rows.length} of ${d.reps.length} reps`;
  const maxN = Math.max(...rows.map(r=>r.NOMINATIONS_COUNT), ...rows.map(r=>r.TARGET));
  const tbody=document.getElementById(`tb-${m}`);
  const nr=document.getElementById(`nr-${m}`);
  const tbl=document.getElementById(`tbl-${m}`);
  if(!rows.length){tbody.innerHTML='';nr.style.display='';tbl.style.display='none';return;}
  nr.style.display='none';tbl.style.display='';
  tbody.innerHTML=rows.map(r=>{
    const fw=Math.min(r.NOMINATIONS_COUNT/maxN*100,100);
    const tgtPos=Math.min(r.TARGET/maxN*100,100);
    const qualified=r.QUALIFIED_COUNT||0;
    const qw=r.NOMINATIONS_COUNT>0?Math.min(qualified/r.NOMINATIONS_COUNT*fw,fw):0;
    const acctsOver3=r.ACCOUNTS_OVER_3||0;
    return `<tr>
      <td><strong>${r.REP_NAME}</strong></td>
      <td>${r.MANAGER_NAME}</td>
      <td>${shortSeg(r.SEGMENT)}</td>
      <td>${r.TARGET}</td>
      <td><div class="bar-wrap">
        <div class="bar-bg">
          <div class="bar-fill" style="width:${fw}%;background:#BDBDBD"></div>
          <div class="bar-fill" style="width:${qw}%;background:#6B4FBB;position:absolute;top:0;left:0"></div>
          <div class="bar-target" style="left:${tgtPos}%"></div>
        </div>
        <span class="bar-val"><span style="color:#6B4FBB;font-weight:700;font-size:13px">${qualified}</span>/${r.NOMINATIONS_COUNT}</span>
      </div></td>
      <td>${r.REMAINING}</td>
      <td>${badge(r.STATUS)}</td>
      <td>${acctsOver3>0?`<span class="badge r">⚠️ ${acctsOver3}</span>`:acctsOver3}</td>
    </tr>`;
  }).join('');
}

function switchTab(m){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',MONTH_KEYS[i]===m));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(`page-${m}`).classList.add('active');
  render(m);
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.ms-wrap'))document.querySelectorAll('.ms-list').forEach(l=>l.classList.remove('open'));
  const th=e.target.closest('th[data-col]');
  if(!th)return;
  const col=th.dataset.col,m=th.dataset.m,sc=sortState[m];
  if(sc.col===col)sc.dir*=-1;
  else{sc.col=col;sc.dir=(col==='REP_NAME'||col==='MANAGER_NAME')?1:-1;}
  th.closest('thead').querySelectorAll('th').forEach(t=>t.classList.remove('asc','desc'));
  th.classList.add(sc.dir===1?'asc':'desc');
  render(m);
});

MONTH_KEYS.forEach(m=>{sortState[m]={col:'NOMINATIONS_COUNT',dir:-1};document.getElementById(`page-${m}`).innerHTML=buildPage(m);});
MONTH_KEYS.forEach(m=>render(m));
</script>
</body>
</html>
