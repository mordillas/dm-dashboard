<html lang="en">

<meta charset="UTF-8">

<title>DM Nomination Progress Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f9;color:#181818}
.tab-bar{display:flex;background:#0176D3;padding:0 24px;gap:4px;align-items:flex-end}
.tab-title{color:white;font-size:18px;font-weight:700;padding:14px 0 14px 4px;flex:1}
.refreshed{color:rgba(255,255,255,.65);font-size:12px;padding:14px 8px;align-self:center}
.tab{padding:12px 22px;color:rgba(255,255,255,.7);cursor:pointer;border-radius:6px 6px 0 0;font-size:14px;font-weight:600;border:none;background:none;transition:all .15s}
.tab:hover{color:white;background:rgba(255,255,255,.1)}
.tab.active{color:#0176D3;background:white}
.kpi-bar{display:flex;background:white;border-bottom:2px solid #e8e8e8;flex-wrap:wrap}
.kpi{text-align:center;padding:16px 20px;min-width:110px;border-right:1px solid #f0f0f0}
.kpi .value{font-size:26px;font-weight:700}
.kpi .label{font-size:11px;color:#706E6B;margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.green{color:#2E844A}.red{color:#C23934}.blue{color:#0176D3}
.kpi-deadline{margin-left:auto;padding:16px 24px;display:flex;align-items:center;gap:6px;font-size:13px;color:#706E6B}
.controls{display:flex;gap:12px;padding:14px 24px;background:white;border-bottom:1px solid #e8e8e8;flex-wrap:wrap;align-items:center}
.controls label{font-size:12px;color:#706E6B;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
select,input{padding:7px 11px;border:1px solid #DDDBDA;border-radius:4px;font-size:13px;background:white;cursor:pointer}
select{min-width:200px}input{min-width:200px}
.count-badge{font-size:12px;color:#706E6B;margin-left:auto;background:#f4f6f9;padding:5px 12px;border-radius:12px}
.table-wrap{padding:20px 24px}
table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
th{background:#f8f8f8;padding:10px 14px;text-align:left;font-size:11px;color:#706E6B;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #e8e8e8;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{background:#efefef}th.asc::after{content:" ↑"}th.desc::after{content:" ↓"}
td{padding:9px 14px;font-size:13px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:last-child td{border-bottom:none}tr:hover td{background:#fafcff}
.bar-wrap{display:flex;align-items:center;gap:8px;min-width:200px}
.bar-bg{flex:1;background:#f0f0f0;border-radius:3px;height:10px;position:relative}
.bar-fill{height:10px;border-radius:3px}
.bar-target{position:absolute;top:-3px;bottom:-3px;width:2px;background:#0176D3;border-radius:1px;opacity:.7}
.bar-val{font-size:12px;color:#706E6B;white-space:nowrap;min-width:58px;text-align:right}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600}
.g{background:#e6f3eb;color:#2E844A}.y{background:#fef3e2;color:#DD7A01}.r{background:#fde8e8;color:#C23934}
.no-results{text-align:center;padding:48px;color:#706E6B;font-size:14px}
.page{display:none}.page.active{display:block}
</style>
</head>

, "TARGET": 40, "NOMINATIONS_COUNT": 8, "REMAINING": 32, "PCT_COMPLETE": "20.0", "STATUS": "Behind", "CATEGORY": "rep"}, {"MANAGER_NAME": "Yasa Salari", "REP_NAME": "Nathan Le", "SEGMENT": "SDR - NAMER - US - Core - Outbound - STRAT", "TARGET": 100, "NOMINATIONS_COUNT": 0, "REMAINING": 100, "PCT_COMPLETE": "0.0", "STATUS": "Behind", "CATEGORY": "rep"}, {"MANAGER_NAME": "Yasa Salari", "REP_NAME": "Lauren Sperry", "SEGMENT": "SDR - NAMER - US - Core - Outbound - STRAT", "TARGET": 100, "NOMINATIONS_COUNT": 0, "REMAINING": 100, "PCT_COMPLETE": "0.0", "STATUS": "Behind", "CATEGORY": "rep"}, {"MANAGER_NAME": "Yasa Salari", "REP_NAME": "Matt Torregroza", "SEGMENT": "SDR - NAMER - US - Core - Outbound - STRAT", "TARGET": 100, "NOMINATIONS_COUNT": 0, "REMAINING": 100, "PCT_COMPLETE": "0.0", "STATUS": "Behind", "CATEGORY": "rep"}, {"MANAGER_NAME": "Yasa Salari", "REP_NAME": "Julian Becker", "SEGMENT": "SDR - NAMER - US - Core - Outbound - STRAT", "TARGET": 100, "NOMINATIONS_COUNT": 0, "REMAINING": 100, "PCT_COMPLETE": "0.0", "STATUS": "Behind", "CATEGORY": "rep"}], "mm": 33, "other": 27, "totalNoms": 1814, "repsDone": 2, "totalReps": 225, "repsBehind": 223, "pct": 9.1, "daysLeft": 11, "deadline": "Jun 22", "label": "August 2026", "managers": ["Amanda Romano", "Andrew Camp", "Annie Kevorkian", "Antonio Del Pozo", "Apoorva Sharma", "Brandon Babiker", "Chris French", "Chukwunonso Chidume", "Clayton DeSilva", "Cooper Snowdon", "David Diken", "Erica Reid", "Jake Thompson", "Jenna Lavinio", "Joel Myers", "John Unser", "Jordan Watson", "Kyle Brady", "Lexy Solomon", "Liam Christiansen", "Logan Semegram", "Louis Sipowicz", "Matt Lupiano", "Matthew Osit", "Mohamed Hussain", "Nick Nizza", "Nick Patrikis", "Pranjul Singh", "Raza Memon", "Rose Redfoot", "Ryan J Boyle", "Savannah Madrid", "Tanvi Nikam", "Wylie Sherman", "Yasa Salari"]}};
const MONTH_KEYS = ["august", "july", "june"];
let sortState = {};

function barColor(p){ return p>=100?'#2E844A':p>=80?'#DD7A01':'#C23934'; }
function badge(s){
  if(s==='On Track') return '<span class="badge g">On Track</span>';
  if(s==='At Risk')  return '<span class="badge y">At Risk</span>';
  return '<span class="badge r">Behind</span>';
}
function shortSeg(s){
  return s.replace('SDR - NAMER - US - Core - Outbound - ','').replace('SDR - NAMER - US - Core - Outbound','Outbound');
}

function buildPage(m){
  const d = MONTHS[m];
  const dLabel = d.daysLeft>0
    ? `<strong>${d.daysLeft} days remaining</strong>`
    : d.daysLeft===0 ? '<strong>Deadline today</strong>'
    : `<span class="red">Closed — ${Math.abs(d.daysLeft)} days ago</span>`;
  const pc = d.pct>=80?'green':d.pct>=50?'':'red';
  const dc = d.repsDone/d.totalReps>=0.8?'green':'red';
  const mgOpts = d.managers.map(mg=>`<option value="${mg}">${mg}</option>`).join('');
  return `
    <div class="kpi-bar">
      <div class="kpi"><div class="value ${dc}">${d.repsDone}/${d.totalReps}</div><div class="label">At Target</div></div>
      <div class="kpi"><div class="value red">${d.repsBehind}</div><div class="label">Behind</div></div>
      <div class="kpi"><div class="value ${pc}">${d.pct}%</div><div class="label">Rep Progress</div></div>
      <div class="kpi"><div class="value">${d.totalNoms.toLocaleString()}</div><div class="label">Total Noms</div></div>
      <div class="kpi"><div class="value">${d.mm.toLocaleString()}</div><div class="label">MM A+</div></div>
      <div class="kpi"><div class="value">${d.other.toLocaleString()}</div><div class="label">Other</div></div>
      <div class="kpi-deadline">Deadline: <strong>${d.deadline}</strong>&nbsp;&nbsp;${dLabel}</div>
    </div>
    <div class="controls">
      <label>Manager</label>
      <select id="mg-${m}" onchange="render('${m}')">
        <option value="">All (${d.managers.length})</option>${mgOpts}
      </select>
      <label>Status</label>
      <select id="st-${m}" onchange="render('${m}')">
        <option value="">All</option>
        <option value="On Track">✅ On Track</option>
        <option value="At Risk">⚠️ At Risk</option>
        <option value="Behind">🔴 Behind</option>
      </select>
      <input id="sr-${m}" type="text" placeholder="Search rep…" oninput="render('${m}')">
      <span class="count-badge" id="cnt-${m}"></span>
    </div>
    <div class="table-wrap">
      <table id="tbl-${m}">
        <thead><tr>
          <th data-col="REP_NAME" data-m="${m}">Rep</th>
          <th data-col="MANAGER_NAME" data-m="${m}">Manager</th>
          <th data-col="SEGMENT" data-m="${m}">Segment</th>
          <th data-col="NOMINATIONS_COUNT" data-m="${m}" class="desc">Nominations</th>
          <th data-col="REMAINING" data-m="${m}">Remaining</th>
          <th data-col="PCT_COMPLETE" data-m="${m}">% Complete</th>
          <th data-col="STATUS" data-m="${m}">Status</th>
        </tr></thead>
        <tbody id="tb-${m}"></tbody>
      </table>
      <div class="no-results" id="nr-${m}" style="display:none">No reps match your filters.</div>
    </div>`;
}

function render(m){
  const d = MONTHS[m];
  const mg = document.getElementById(`mg-${m}`).value;
  const st = document.getElementById(`st-${m}`).value;
  const sr = document.getElementById(`sr-${m}`).value.toLowerCase();
  let rows = d.reps.filter(r=>
    (!mg||r.MANAGER_NAME===mg)&&(!st||r.STATUS===st)&&(!sr||r.REP_NAME.toLowerCase().includes(sr))
  );
  const sc = sortState[m]||{col:'NOMINATIONS_COUNT',dir:-1};
  rows.sort((a,b)=>{
    let av=a[sc.col],bv=b[sc.col];
    if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase();}
    return av<bv?-sc.dir:av>bv?sc.dir:0;
  });
  document.getElementById(`cnt-${m}`).textContent =
    rows.length===d.reps.length?`${d.reps.length} reps`:`${rows.length} of ${d.reps.length} reps`;
  const maxN = Math.max(...rows.map(r=>r.NOMINATIONS_COUNT), ...rows.map(r=>r.TARGET));
  const tbody=document.getElementById(`tb-${m}`);
  const nr=document.getElementById(`nr-${m}`);
  const tbl=document.getElementById(`tbl-${m}`);
  if(!rows.length){tbody.innerHTML='';nr.style.display='';tbl.style.display='none';return;}
  nr.style.display='none';tbl.style.display='';
  tbody.innerHTML=rows.map(r=>{
    const pct=parseFloat(r.PCT_COMPLETE);
    const fw=Math.min(r.NOMINATIONS_COUNT/maxN*100,100);
    const tgtPos=Math.min(r.TARGET/maxN*100,100);
    return `<tr>
      <td><strong>${r.REP_NAME}</strong></td>
      <td>${r.MANAGER_NAME}</td>
      <td>${shortSeg(r.SEGMENT)}</td>
      <td><div class="bar-wrap">
        <div class="bar-bg">
          <div class="bar-fill" style="width:${fw}%;background:${barColor(pct)}"></div>
          <div class="bar-target" style="left:${tgtPos}%"></div>
        </div>
        <span class="bar-val">${r.NOMINATIONS_COUNT}/${r.TARGET}</span>
      </div></td>
      <td>${r.REMAINING}</td>
      <td><strong>${pct.toFixed(1)}%</strong></td>
      <td>${badge(r.STATUS)}</td>
    </tr>`;
  }).join('');
}

function switchTab(m){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',MONTH_KEYS[i]===m));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(`page-${m}`).classList.add('active');
  render(m);
}

document.addEventListener('click',e=>{
  const th=e.target.closest('th[data-col]');
  if(!th)return;
  const col=th.dataset.col,m=th.dataset.m,sc=sortState[m];
  if(sc.col===col)sc.dir*=-1;
  else{sc.col=col;sc.dir=(col==='REP_NAME'||col==='MANAGER_NAME')?1:-1;}
  th.closest('thead').querySelectorAll('th').forEach(t=>t.classList.remove('asc','desc'));
  th.classList.add(sc.dir===1?'asc':'desc');
  render(m);
});

MONTH_KEYS.forEach(m=>{sortState[m]={col:'NOMINATIONS_COUNT',dir:-1};document.getElementById(`page-${m}`).innerHTML=buildPage(m);});
MONTH_KEYS.forEach(m=>render(m));
</script>
